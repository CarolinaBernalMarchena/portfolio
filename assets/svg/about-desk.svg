  <path d="M40 40 L43 47 L50 47 L44 51 L46 58 L40 54 L34 58 L36 51 L30 47 L37 47 Z" fill="#dd5d94" opacity="0.8"/>
  <path d="M215 90 L217 95 L222 95 L218 98 L220 103 L215 100 L210 103 L212 98 L208 95 L213 95 Z" fill="#9c78bf" opacity="0.8"/>

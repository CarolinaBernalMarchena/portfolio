<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="260" height="260" fill="#fbeaf2"/>
  <!-- laptop -->
  <rect x="55" y="120" width="110" height="70" rx="6" fill="#f2a9c6" stroke="#4a3247" stroke-width="2"/>
  <rect x="63" y="128" width="94" height="50" rx="3" fill="#fffdfa"/>
  <path d="M55 190 L165 190 L178 202 L42 202 Z" fill="#dd5d94" stroke="#4a3247" stroke-width="2"/>
  <path d="M95 145 L108 158 L128 138" fill="none" stroke="#dd5d94" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pixel heart on screen -->
  <g transform="translate(85,150)">
    <rect x="0" y="0" width="4" height="4" fill="#dd5d94"/>
  </g>
  <!-- Nintendo DS -->
  <g transform="translate(150,60) rotate(-8)">
    <rect x="0" y="0" width="46" height="70" rx="6" fill="#c7addb" stroke="#4a3247" stroke-width="2"/>
    <rect x="6" y="6" width="34" height="26" rx="2" fill="#fffdfa"/>
    <rect x="6" y="36" width="34" height="26" rx="2" fill="#fffdfa"/>
    <circle cx="23" cy="49" r="4" fill="#c7addb"/>
  </g>
  <!-- teacup -->
  <g transform="translate(30,60)">

    <path d="M2 15h36v14a18 18 0 0 1-36 0Z" fill="#fffdfa" stroke="#4a3247" stroke-width="2"/>
    <path d="M38 20c8-2 8 12 0 12" fill="none" stroke="#4a3247" stroke-width="2"/>
    <path d="M10 15c0-6 4-8 4-13M20 15c0-6 4-8 4-13" stroke="#bfe3d2" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
